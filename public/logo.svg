<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 64" width="260" height="64" role="img" aria-label="WetoDrive">
  <defs>
    <linearGradient id="wtdl-badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="wtdl-tri" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#DBEAFE"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="16" fill="url(#wtdl-b)"/>

  <!-- Motion chevrons: the transfer arriving, in Drive's palette -->
  <g fill="none" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 25.5 L11.5 32 L5 38.5"  stroke="#FBBC04" opacity=".55"/>
    <path d="M14 25.5 L20.5 32 L14 38.5" stroke="#34A853" opacity=".85"/>
  </g>

  <!-- Three folded panels, so the drive reads with depth rather than as a flat triangle -->
  <g stroke-linejoin="round">
    <path d="M42 13 L28.6 43 H42 Z" fill="#FFFFFF"/>
    <path d="M42 13 L42 43 H55.4 Z" fill="#BFD6FF"/>
    <path d="M28.6 43 H55.4 L58.4 49.6 a1.8 1.8 0 0 1-1.6 2.6 H27.2 a1.8 1.8 0 0 1-1.6-2.6 Z" fill="#7FA9FF"/>
  </g>

  <text x="80" y="41.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif"
        font-size="25" font-weight="700" letter-spacing="-0.5" fill="#0F172A">Weto<tspan fill="#2563EB">Drive</tspan></text>
</svg>
