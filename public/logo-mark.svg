<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="WetoDrive">
  <defs>
    <linearGradient id="wtd-b" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4F46E5"/><stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="wtd-w" x1=".2" y1="0" x2=".8" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/><stop offset="100%" stop-color="#E4ECFF"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#wtd-b)"/>
  <!-- speed trails, parallel to the flight path -->
  <g stroke="#BFD6FF" stroke-width="2.6" stroke-linecap="round">
    <path d="M8 36 L16 32" opacity=".30"/>
    <path d="M9 45 L20 39" opacity=".45"/>
    <path d="M15 53 L25 47" opacity=".28"/>
  </g>
  <!-- folded plane: upper wing, keel, shadowed inner fold -->
  <path d="M56 8 L11 27 L29 33 Z" fill="url(#wtd-w)"/>
  <path d="M56 8 L29 33 L31 57 Z" fill="#A9C6FF"/>
  <path d="M29 33 L31 57 L40 43 Z" fill="#6C93E8"/>
</svg>
