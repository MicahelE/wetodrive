name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            cd /var/www/wetodrive.com
            git pull origin main
            composer install --no-dev --optimize-autoloader
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            npm ci && npm run build
            php artisan migrate --force
            php artisan config:cache
            # After config:cache, because the URL list reads config (APP_URL, Dropbox).
            # It only rewrites when a page was added or removed. Never commit
            # public/sitemap.xml: it is modified here, and git pull would refuse.
            php artisan sitemap:generate
            php artisan route:cache
            php artisan view:cache
